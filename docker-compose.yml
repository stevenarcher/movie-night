services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: movie
      POSTGRES_PASSWORD: movie
      POSTGRES_DB: movie_night
    ports:
      - "5432:5432"
    volumes:
      - movie_night_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie -d movie_night"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  movie_night_pgdata: